[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shunt-notify"
version = "0.1.0"
requires-python = ">=3.11"
description = "Durable notification delivery receipts for Shunt project hooks"

[project.scripts]
shunt-notify = "shunt_notify:main"

[tool.setuptools]
packages = ["shunt_notify"]
