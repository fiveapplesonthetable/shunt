[package]
name = "tacho-ingest-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tacho-ingest = { path = ".." }
serde_json = "1.0"

[[bin]]
name = "fuzz_hooks"
path = "fuzz_targets/fuzz_hooks.rs"
test = false
doc = false

[[bin]]
name = "fuzz_streams"
path = "fuzz_targets/fuzz_streams.rs"
test = false
doc = false

[[bin]]
name = "fuzz_otlp"
path = "fuzz_targets/fuzz_otlp.rs"
test = false
doc = false

[[bin]]
name = "fuzz_emit"
path = "fuzz_targets/fuzz_emit.rs"
test = false
doc = false

# Prevent cargo from treating fuzz as part of parent workspace
[workspace]
