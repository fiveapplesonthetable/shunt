[package]
name = "tacho-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tacho-core = { path = "../tacho-core" }
tacho-proto = { path = "../tacho-proto" }
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.8"
flate2 = "1.0"
libc = "0.2"
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "with-serde", "logs", "metrics", "trace"] }

[dev-dependencies]
proptest = "1.12"
