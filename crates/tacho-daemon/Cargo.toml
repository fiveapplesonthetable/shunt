[package]
name = "tacho-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tacho-core = { path = "../tacho-core" }
tacho-proto = { path = "../tacho-proto" }
tacho-ingest = { path = "../tacho-ingest" }
prost = "0.14"
rusqlite = { version = "0.33", features = ["bundled"] }
crossbeam-channel = "0.5"
arc-swap = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
signal-hook = "0.3"
libc = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
flate2 = "1.0"

[[bench]]
name = "bench_throughput"
harness = false
