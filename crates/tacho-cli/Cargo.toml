[package]
name = "tachograph"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "tachograph"
path = "src/lib.rs"

[[bin]]
name = "tacho"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tacho-system = { path = "../tacho-system" }
tacho-daemon = { path = "../tacho-daemon" }
tacho-ingest = { path = "../tacho-ingest" }
tacho-core = { path = "../tacho-core" }
blake3 = "1.5"
libc = "0.2"
signal-hook = "0.3"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "hook_bench"
harness = false
