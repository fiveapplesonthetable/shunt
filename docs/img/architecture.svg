<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 550" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #202124; }
      .text-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #3c4043; text-transform: uppercase; letter-spacing: 0.5px; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #3c4043; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #70757a; }
      .text-mono { font-family: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #202124; }
      .box { fill: #f8f9fa; stroke: #dadce0; stroke-width: 1.2; rx: 4px; }
      .box-source { fill: #f1f3f4; stroke: #bdc1c6; stroke-width: 1.2; rx: 4px; }
      .box-appender { fill: #e8f0fe; stroke: #aecbfa; stroke-width: 1.5; rx: 6px; }
      .box-db { fill: #fef7e0; stroke: #fdd663; stroke-width: 1.5; rx: 6px; }
      .box-out { fill: #f3e8fd; stroke: #d7aefb; stroke-width: 1.5; rx: 6px; }
      .box-step { fill: #ffffff; stroke: #c6dafc; stroke-width: 1; rx: 3px; }
      .box-sub { fill: #ffffff; stroke: #fdd663; stroke-width: 1; rx: 3px; }
      .arrow { stroke: #5f6368; stroke-width: 1.3; fill: none; marker-end: url(#ah); }
      .arrow-accent { stroke: #1a73e8; stroke-width: 1.5; fill: none; marker-end: url(#aha); }
      .arrow-dashed { stroke: #70757a; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; marker-end: url(#ah); }
      .tag { font-family: "Roboto Mono", ui-monospace, monospace; font-size: 9.5px; fill: #1a73e8; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #202124; }
        .text-title { fill: #e8eaed; }
        .text-head { fill: #bdc1c6; }
        .text-body { fill: #e8eaed; }
        .text-muted { fill: #9aa0a6; }
        .text-mono { fill: #e8eaed; }
        .box { fill: #292a2d; stroke: #5f6368; }
        .box-source { fill: #303134; stroke: #5f6368; }
        .box-appender { fill: #1c2b46; stroke: #4285f4; }
        .box-db { fill: #3c3214; stroke: #f9ab00; }
        .box-out { fill: #2d1e3e; stroke: #af5cf7; }
        .box-step { fill: #202124; stroke: #4285f4; }
        .box-sub { fill: #202124; stroke: #f9ab00; }
        .arrow { stroke: #9aa0a6; }
        .arrow-accent { stroke: #8ab4f8; }
        .arrow-dashed { stroke: #9aa0a6; }
        .tag { fill: #8ab4f8; }
      }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#5f6368"/>
    </marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1020" height="550" class="bg"/>

  <!-- COLUMN 1: INGESTION SOURCES -->
  <text x="25" y="32" class="text-head">1 · Ingestion Sources</text>

  <!-- Claude Code Hooks -->
  <g transform="translate(25, 45)">
    <rect width="170" height="44" class="box-source"/>
    <text x="12" y="20" class="text-title">Claude Code</text>
    <text x="12" y="35" class="text-muted">Pre/PostToolUse · Subagent</text>
  </g>

  <!-- Gemini CLI Hooks -->
  <g transform="translate(25, 98)">
    <rect width="170" height="44" class="box-source"/>
    <text x="12" y="20" class="text-title">Gemini CLI</text>
    <text x="12" y="35" class="text-muted">Before/AfterTool · Session</text>
  </g>

  <!-- Jetski Hooks -->
  <g transform="translate(25, 151)">
    <rect width="170" height="44" class="box-source"/>
    <text x="12" y="20" class="text-title">Jetski Hooks</text>
    <text x="12" y="35" class="text-muted">Pre/PostInvocation</text>
  </g>

  <!-- tacho run (subprocess tee) -->
  <g transform="translate(25, 204)">
    <rect width="170" height="44" class="box-source"/>
    <text x="12" y="20" class="text-title">tacho run -- cmd</text>
    <text x="12" y="35" class="text-muted">PTY/pipe tee · stream-json</text>
  </g>

  <!-- tacho tail (inotify .jsonl) -->
  <g transform="translate(25, 257)">
    <rect width="170" height="44" class="box-source"/>
    <text x="12" y="20" class="text-title">tacho tail</text>
    <text x="12" y="35" class="text-muted">inotify .jsonl · atomic offsets</text>
  </g>

  <!-- OTLP HTTP Server -->
  <g transform="translate(25, 310)">
    <rect width="170" height="44" class="box-source"/>
    <text x="12" y="20" class="text-title">OTLP Receiver</text>
    <text x="12" y="35" class="text-muted">:4318 proto/json · gzip</text>
  </g>

  <!-- tacho emit -->
  <g transform="translate(25, 363)">
    <rect width="170" height="44" class="box-source"/>
    <text x="12" y="20" class="text-title">tacho emit</text>
    <text x="12" y="35" class="text-muted">task · span · state · counter</text>
  </g>

  <!-- /proc + cgroup v2 Sampler -->
  <g transform="translate(25, 416)">
    <rect width="170" height="44" class="box-source"/>
    <text x="12" y="20" class="text-title">/proc + cgroup v2</text>
    <text x="12" y="35" class="text-muted">PID tree slots, cpu, rss, load1</text>
  </g>

  <!-- Bounded Channel -->
  <g transform="translate(225, 185)">
    <rect width="40" height="150" class="box" stroke-dasharray="3,3"/>
    <text x="20" y="26" class="text-muted" transform="rotate(90, 20, 26)" text-anchor="start">Bounded Channel (64k)</text>
  </g>

  <!-- Arrows from Sources to Bounded Channel -->
  <path d="M195,67 L225,195" class="arrow"/>
  <path d="M195,120 L225,212" class="arrow"/>
  <path d="M195,173 L225,229" class="arrow"/>
  <path d="M195,226 L225,246" class="arrow"/>
  <path d="M195,279 L225,263" class="arrow"/>
  <path d="M195,332 L225,280" class="arrow"/>
  <path d="M195,385 L225,297" class="arrow"/>
  <path d="M195,438 L225,315" class="arrow"/>

  <!-- COLUMN 2: SINGLE-THREADED APPENDER -->
  <text x="295" y="32" class="text-head">2 · Daemon Appender Thread</text>

  <g transform="translate(295, 45)">
    <rect width="250" height="415" class="box-appender"/>
    <text x="18" y="26" class="text-title">Single Appender Thread</text>
    <text x="18" y="42" class="text-muted">Exclusive writer: zero lock contention</text>

    <!-- Step 1: Clock Snapshot -->
    <g transform="translate(14, 56)">
      <rect width="222" height="46" class="box-step"/>
      <text x="10" y="20" class="text-title">1. Clock Stamp &amp; Clamp</text>
      <text x="10" y="35" class="text-muted">CLOCK_REALTIME + CLOCK_BOOTTIME</text>
    </g>

    <!-- Step 2: Default-On Privacy Scrubber -->
    <g transform="translate(14, 110)">
      <rect width="222" height="52" class="box-step"/>
      <text x="10" y="19" class="text-title">2. Privacy Scrubber (Default On)</text>
      <text x="10" y="33" class="text-muted">scrub=true by default (opt-out: false)</text>
      <text x="10" y="46" class="text-muted">Always drops raw prose &amp; diffs</text>
    </g>

    <!-- Step 3: Command Classifier -->
    <g transform="translate(14, 170)">
      <rect width="222" height="46" class="box-step"/>
      <text x="10" y="19" class="text-title">3. Command Classifier</text>
      <text x="10" y="34" class="text-muted">Peel wrappers · 12 classes + git_tree</text>
    </g>

    <!-- Step 4: Lane Allocator -->
    <g transform="translate(14, 224)">
      <rect width="222" height="52" class="box-step"/>
      <text x="10" y="19" class="text-title">4. Lane &amp; Slot Allocator</text>
      <text x="10" y="33" class="text-muted">Nested stacks per run (turns, lane:k)</text>
      <text x="10" y="46" class="text-muted">Process tree slots (procs/slot 0..k)</text>
    </g>

    <!-- Step 5: State Machine & 7 Detectors -->
    <g transform="translate(14, 284)">
      <rect width="222" height="52" class="box-step"/>
      <text x="10" y="19" class="text-title">5. State Fold &amp; 7 Detectors</text>
      <text x="10" y="33" class="text-muted">SILENT, LOOP, SPIN, BURN, FAILING,</text>
      <text x="10" y="46" class="text-muted">OFF_BRIEF, CLAIM + on_stall hook</text>
    </g>

    <!-- Step 6: WAL Commit -->
    <g transform="translate(14, 344)">
      <rect width="222" height="54" class="box-step"/>
      <text x="10" y="19" class="text-title">6. Batch WAL Transaction</text>
      <text x="10" y="33" class="text-muted">Batch: up to 256 events or 50 ms</text>
      <text x="10" y="46" class="text-muted">PRAGMA synchronous = NORMAL</text>
    </g>
  </g>

  <!-- Channel to Appender -->
  <path d="M265,260 L295,260" class="arrow-accent"/>

  <!-- COLUMN 3: UNIFIED SQLITE WAL STORAGE -->
  <text x="585" y="32" class="text-head">3 · Single Source of Truth</text>

  <g transform="translate(585, 45)">
    <rect width="200" height="415" class="box-db"/>
    <text x="14" y="26" class="text-title">SQLite WAL Event Log</text>
    <text x="14" y="42" class="tag">$TACHO_HOME/events.sqlite</text>
    <line x1="14" y1="54" x2="186" y2="54" stroke="#fdd663" stroke-width="1"/>

    <text x="14" y="74" class="text-body">• Sole durable source of truth</text>
    <text x="14" y="94" class="text-body">• No separate in-memory rings</text>
    <text x="14" y="114" class="text-body">• TrackCreated UUID registry</text>
    <text x="14" y="134" class="text-body">• Full seq &amp; ts_ns index</text>
    <text x="14" y="154" class="text-body">• 100% event resolution</text>
    <text x="14" y="174" class="text-body">• Hourly small-batch pruner</text>

    <!-- Sub-box 1: Streaming WAL Cursor -->
    <g transform="translate(12, 194)">
      <rect width="176" height="96" class="box-sub"/>
      <text x="10" y="20" class="text-title">Concurrent WAL Readers</text>
      <text x="10" y="38" class="text-muted">• Zero writer/reader blocking</text>
      <text x="10" y="54" class="text-muted">• SnapshotProjector pairs</text>
      <text x="10" y="68" class="text-muted">  durations, states &amp; counters</text>
      <text x="10" y="84" class="text-muted">• O(1) memory streaming</text>
    </g>

    <!-- Sub-box 2: Folded State & Fallback -->
    <g transform="translate(12, 302)">
      <rect width="176" height="96" class="box-sub"/>
      <text x="10" y="20" class="text-title">Log-Derived State Fold</text>
      <text x="10" y="38" class="text-muted">• Rebuilt via Recorder::restore</text>
      <text x="10" y="54" class="text-muted">• Serves status, report, watch</text>
      <text x="10" y="70" class="text-muted">• Direct read-only SQLite</text>
      <text x="10" y="84" class="text-muted">  fallback if daemon is down</text>
    </g>
  </g>

  <!-- Appender to SQLite WAL -->
  <path d="M545,252 L585,252" class="arrow-accent"/>

  <!-- COLUMN 4: CONSUMPTION INTERFACES -->
  <text x="825" y="32" class="text-head">4 · Readers &amp; Tools</text>

  <!-- tacho trace (Perfetto) -->
  <g transform="translate(825, 45)">
    <rect width="170" height="104" class="box-out"/>
    <text x="12" y="22" class="text-title">tacho trace</text>
    <text x="12" y="38" class="text-muted">Streams .perfetto-trace</text>
    <text x="12" y="56" class="text-body">ui.perfetto.dev</text>
    <text x="12" y="72" class="text-body">Durations, States, Counters</text>
    <text x="12" y="88" class="text-muted">0 instant clutter · 0 errors</text>
  </g>

  <!-- Optional traced Merge -->
  <g transform="translate(825, 162)">
    <rect width="170" height="82" class="box"/>
    <text x="12" y="22" class="text-title">System Tracing</text>
    <text x="12" y="38" class="text-muted">Perfetto traced clone</text>
    <text x="12" y="56" class="text-body">tacho trace --system</text>
    <text x="12" y="72" class="text-muted">Merged by ClockSnapshot</text>
  </g>

  <!-- Live CLI inspection -->
  <g transform="translate(825, 258)">
    <rect width="170" height="114" class="box-out"/>
    <text x="12" y="22" class="text-title">Supervisor CLI</text>
    <text x="12" y="40" class="text-mono">tacho status</text>
    <text x="12" y="58" class="text-mono">tacho watch --until</text>
    <text x="12" y="76" class="text-mono">tacho report --diff-claims</text>
    <text x="12" y="96" class="text-muted">&lt; 200 tokens per check</text>
  </g>

  <!-- Analytical Queries -->
  <g transform="translate(825, 386)">
    <rect width="170" height="74" class="box-out"/>
    <text x="12" y="22" class="text-title">tacho query &lt;name&gt;</text>
    <text x="12" y="40" class="text-muted">10 PerfettoSQL queries</text>
    <text x="12" y="56" class="text-muted">Standard &amp; pipe syntax</text>
  </g>

  <!-- Arrows to Consumption -->
  <path d="M785,110 L825,95" class="arrow-accent"/>
  <path d="M785,200 L825,200" class="arrow-dashed"/>
  <path d="M785,315 L825,315" class="arrow-accent"/>
  <path d="M785,242 C805,242 805,423 825,423" class="arrow"/>

  <!-- Footer note -->
  <text x="25" y="512" class="text-muted">Tachograph architecture: single appender writer guarantees zero lock contention; SQLite WAL (events.sqlite) is the sole source of truth for traces, queries, and supervisor state.</text>
</svg>
