<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #202124; }
      .text-section { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #3c4043; text-transform: uppercase; letter-spacing: 0.5px; }
      .text-track { font-family: "Roboto Mono", ui-monospace, monospace; font-size: 11px; font-weight: 500; fill: #1a73e8; }
      .text-slice { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #202124; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #5f6368; }
      .text-bad { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #d93025; }
      .text-good { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #188038; }
      .text-time { font-family: "Roboto Mono", ui-monospace, monospace; font-size: 9.5px; fill: #70757a; }
      
      .slice-turn { fill: #e8f0fe; stroke: #4285f4; stroke-width: 1.2; rx: 3px; }
      .slice-tool-a { fill: #fef7e0; stroke: #f9ab00; stroke-width: 1.2; rx: 3px; }
      .slice-tool-b { fill: #e6f4ea; stroke: #34a853; stroke-width: 1.2; rx: 3px; }
      .slice-subagent { fill: #f3e8fd; stroke: #af5cf7; stroke-width: 1.2; rx: 3px; }
      .slice-abandoned { fill: #fce8e6; stroke: #ea4335; stroke-width: 1.2; stroke-dasharray: 4,2; rx: 3px; }
      
      .track-bg { fill: #f8f9fa; stroke: #dadce0; stroke-width: 1; rx: 4px; }
      .time-line { stroke: #e0e0e0; stroke-width: 1; stroke-dasharray: 3,3; }
      .error-badge { fill: #fce8e6; stroke: #ea4335; stroke-width: 1; rx: 3px; }
      .ok-badge { fill: #e6f4ea; stroke: #34a853; stroke-width: 1; rx: 3px; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #202124; }
        .text-title { fill: #e8eaed; }
        .text-section { fill: #bdc1c6; }
        .text-track { fill: #8ab4f8; }
        .text-slice { fill: #e8eaed; }
        .text-desc { fill: #9aa0a6; }
        .text-bad { fill: #f28b82; }
        .text-good { fill: #81c995; }
        .text-time { fill: #9aa0a6; }
        
        .slice-turn { fill: #1c2b46; stroke: #4285f4; }
        .slice-tool-a { fill: #3c3214; stroke: #f9ab00; }
        .slice-tool-b { fill: #133420; stroke: #34a853; }
        .slice-subagent { fill: #2d1e3e; stroke: #af5cf7; }
        .slice-abandoned { fill: #3c1e1e; stroke: #ea4335; }
        
        .track-bg { fill: #292a2d; stroke: #5f6368; }
        .time-line { stroke: #3c4043; }
        .error-badge { fill: #3c1e1e; stroke: #ea4335; }
        .ok-badge { fill: #133420; stroke: #34a853; }
      }
    </style>
  </defs>

  <rect width="1020" height="540" class="bg"/>

  <!-- SECTION 1: THE PROBLEM (Naive single track) -->
  <text x="30" y="30" class="text-section">Problem · Naive Single Track (Corrupts Perfetto Stack)</text>

  <!-- Track Header -->
  <g transform="translate(30, 45)">
    <rect width="960" height="150" class="track-bg"/>
    <text x="16" y="24" class="text-track">agent:1/run:1/turns</text>
    
    <!-- Time Grid Lines -->
    <line x1="200" y1="35" x2="200" y2="140" class="time-line"/>
    <text x="195" y="32" class="text-time">t=10ms</text>
    <line x1="380" y1="35" x2="380" y2="140" class="time-line"/>
    <text x="375" y="32" class="text-time">t=25ms</text>
    <line x1="600" y1="35" x2="600" y2="140" class="time-line"/>
    <text x="595" y="32" class="text-time">t=45ms</text>
    <line x1="780" y1="35" x2="780" y2="140" class="time-line"/>
    <text x="775" y="32" class="text-time">t=60ms</text>

    <!-- Turn 1 Slice -->
    <rect x="150" y="42" width="700" height="96" class="slice-turn"/>
    <text x="160" y="60" class="text-slice">Turn 1 (Claude Code parallel tool dispatch)</text>

    <!-- Tool Call A: t=10 to t=45 -->
    <rect x="200" y="70" width="400" height="30" class="slice-tool-a"/>
    <text x="210" y="88" class="text-slice">ToolCall A: read_file("src/lib.rs")</text>

    <!-- Tool Call B (Overlapping): t=25 to t=60 -->
    <!-- Drawn on top of Tool A, but ends LATER! -->
    <rect x="380" y="104" width="400" height="30" class="slice-tool-b"/>
    <text x="390" y="122" class="text-slice">ToolCall B: run_command("cargo check")</text>

    <!-- Error indicator at t=45ms -->
    <g transform="translate(560, 68)">
      <rect width="180" height="24" class="error-badge"/>
      <text x="8" y="16" class="text-bad">⚠ Tool A ends before Tool B!</text>
    </g>
  </g>
  <text x="30" y="210" class="text-desc">Perfetto expects strict stack nesting: when Tool A ends at t=45, Tool B is on top of the stack. Single-track emission produces UnmatchedEnd and renders broken slices.</text>

  <!-- SECTION 2: THE SOLUTION (Tachograph LaneAllocator) -->
  <text x="30" y="250" class="text-section">Solution · Tachograph LaneAllocator (Deterministic Virtual Lanes)</text>

  <!-- Track 1: turns -->
  <g transform="translate(30, 265)">
    <rect width="960" height="60" class="track-bg"/>
    <text x="16" y="20" class="text-track">agent:1/run:1/turns</text>
    <rect x="150" y="26" width="700" height="28" class="slice-turn"/>
    <text x="160" y="44" class="text-slice">Turn 1</text>
    <!-- Tool A placed in turns because stack top is Turn 1 -->
    <rect x="200" y="28" width="400" height="24" class="slice-tool-a"/>
    <text x="210" y="44" class="text-slice">ToolCall A: read_file("src/lib.rs")</text>
  </g>

  <!-- Track 2: lane:1 -->
  <g transform="translate(30, 335)">
    <rect width="960" height="50" class="track-bg"/>
    <text x="16" y="20" class="text-track">agent:1/run:1/lane:1</text>
    <!-- Tool B allocated to lane:1 because Tool A is active on turns -->
    <rect x="380" y="12" width="400" height="28" class="slice-tool-b"/>
    <text x="390" y="30" class="text-slice">ToolCall B: run_command("cargo check")</text>
  </g>

  <!-- Track 3: lane:2 (Parallel Subagent) -->
  <g transform="translate(30, 395)">
    <rect width="960" height="50" class="track-bg"/>
    <text x="16" y="20" class="text-track">agent:1/run:1/lane:2</text>
    <!-- Tool C (Subagent) allocated to lane:2 -->
    <rect x="450" y="12" width="220" height="28" class="slice-subagent"/>
    <text x="460" y="30" class="text-slice">Subagent: "tester" (ToolCall)</text>
    
    <!-- Abandoned slice recovery -->
    <rect x="700" y="12" width="150" height="28" class="slice-abandoned"/>
    <text x="708" y="28" class="text-slice" fill="#d93025">Abandoned Tool (auto-closed)</text>
  </g>

  <!-- Validation Badge -->
  <g transform="translate(730, 465)">
    <rect width="260" height="30" class="ok-badge"/>
    <text x="12" y="20" class="text-good">✓ 100% Properly Nested on Every Track</text>
  </g>

  <!-- Summary Footer -->
  <text x="30" y="480" class="text-desc">Rule 1: Nest on `turns` if open slice is Turn. Rule 2: Lowest free `lane:k`. Rule 3: New `lane:k+1`.</text>
  <text x="30" y="496" class="text-desc">Rule 4: On Run exit, any slice left unclosed is terminated with `abandoned = true` at the run end timestamp. Proved clean by property test.</text>
</svg>
